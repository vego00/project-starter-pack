[project]
name = "starter-pack-backend"
description = "API for Project Starter Pack"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "langgraph>=1,<2",
    "pyyaml>=6,<7",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "google-genai>=1,<3",
    "httpx>=0.28,<1",
]

[tool.uv]
package = false # app/은 --app-dir(또는 pythonpath)로 실행하며 빌드하지 않는다
