card_id: agent.hitl
version: 1
layer: agent
question: 에이전트가 실행 중간에 사람의 확인을 받아야 하나요?
options:
  - id: none
    name: 없음
    summary: 에이전트가 처음부터 끝까지 사람 개입 없이 실행합니다.
    pros: [구현과 상태 관리가 가장 단순합니다]
    cons: [잘못된 결과나 외부 쓰기를 중간에 막을 수 없습니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 추가 비용 없음
  - id: question
    name: 질문 interrupt
    summary: 정보가 부족할 때 실행을 멈추고 사용자에게 묻습니다.
    pros: [모호한 입력에서 추측을 줄입니다]
    cons: [답을 기다리는 동안 상태를 저장해야 합니다]
    learning_difficulty: medium
    ops_burden: medium
    cost_nature: 상태 저장소 운영 비용
  - id: approval
    name: 승인 interrupt
    summary: 외부 쓰기처럼 되돌리기 어려운 행동 전에 승인을 받습니다.
    pros: [되돌리기 어려운 행동을 사람이 통제합니다]
    cons: [승인 대기와 거절 후 흐름까지 설계해야 합니다]
    learning_difficulty: medium
    ops_burden: medium
    cost_nature: 상태 저장소 운영 비용
signals:
  none: [사용자 확인이 필요한 지점이 없음, 외부 쓰기 없음]
  question: [입력이 모호한 경우가 많음]
  approval: [메일 발송·결제처럼 외부 쓰기가 있음]
requires:
  # Notion 10 §3
  - id: hitl-needs-durable-checkpointer
    when:
      - {card: agent.hitl, not_in: [none]}
      - {card: cloud.target, not_in: [local]}
    require: {card: data.checkpointer, not_in: [memory]}
    message: 배포 환경에서 사람 확인을 기다리려면 재시작해도 남는 체크포인터가 필요합니다.
default_recommendation:
  option: none
  reason: 확인이 필요하다는 신호가 없으면 가장 단순한 구성에서 시작합니다.
learning_refs: [langgraph-interrupt, human-in-the-loop]
