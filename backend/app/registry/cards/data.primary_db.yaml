card_id: data.primary_db
version: 1
layer: data
order: 10
title: 데이터 저장소
question: 서비스가 다루는 데이터를 어디에 저장할까요?
options:
  - id: postgres
    name: PostgreSQL
    summary: 데이터를 PostgreSQL에 저장해 여러 사람이 함께 쓰고 재시작 후에도 조회합니다.
    pros: [재시작 후에도 데이터가 남습니다, 여러 사용자가 동시에 쓸 수 있습니다]
    cons: [DB를 운영하고 백업해야 합니다]
    learning_difficulty: medium
    ops_burden: medium
    cost_nature: DB 운영 비용
  - id: sqlite
    name: SQLite (로컬 데모)
    summary: 데이터를 파일 하나에 저장합니다. 혼자 쓰는 로컬 데모에 맞습니다.
    pros: [별도 서버 없이 파일 하나로 동작합니다]
    cons: [여러 사람이 함께 쓰는 서비스로 키우려면 저장소를 바꿔야 합니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 추가 비용 없음
  - id: none
    name: 없음
    summary: 서비스가 데이터를 따로 저장하지 않습니다.
    pros: [저장소를 만들고 운영할 일이 없습니다]
    cons: [나중에 저장이 필요해지면 구조를 다시 설계해야 합니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 추가 비용 없음
signals:
  postgres: [재시작 후 조회, 다중 사용자]
  sqlite: [로컬 데모, 혼자 사용]
  none: [저장할 데이터가 없음]
artifacts:
  postgres: ["compose:postgres"]
default_recommendation:
  option: postgres
  reason: 저장할 데이터가 있다면 재시작 후에도 남고 여러 사람이 쓸 수 있어야 나중에 다시 고치지 않습니다.
learning_refs: [postgresql]
div_refs: [P4]
