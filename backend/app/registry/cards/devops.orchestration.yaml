card_id: devops.orchestration
version: 1
layer: devops
title: 오케스트레이션
question: 컨테이너 오케스트레이션이 필요한가요?
options:
  - id: none
    name: 불필요 (Compose 유지)
    summary: Docker Compose로 서비스를 실행합니다.
    pros: [배우고 운영할 것이 가장 적습니다]
    cons: [여러 서버로 확장하거나 무중단 배포를 하기 어렵습니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 추가 비용 없음
  - id: local_k8s
    name: 로컬 K8s 학습 (kind·K3s)
    summary: 내 장비에서 Kubernetes를 띄워 학습합니다.
    pros: [비용 없이 Kubernetes를 익힙니다]
    cons: [실제 서비스 운영 경험과는 차이가 있습니다]
    learning_difficulty: high
    ops_burden: medium
    cost_nature: 추가 비용 없음
  - id: single_vm_k3s
    name: 단일 VM K3s
    summary: 서버 한 대에 K3s를 설치해 배포합니다.
    pros: [Kubernetes 방식으로 배포해 볼 수 있습니다]
    cons: [서버가 한 대라 그 서버의 장애를 막지 못합니다]
    learning_difficulty: high
    ops_burden: high
    cost_nature: VM 비용
  - id: managed_k8s
    name: 관리형 K8s (GKE·EKS)
    summary: 클라우드가 관리하는 Kubernetes에 배포합니다.
    pros: [다중 인스턴스와 롤아웃을 지원합니다]
    cons: [클러스터 비용과 학습 부담이 큽니다]
    learning_difficulty: high
    ops_burden: high
    cost_nature: 클러스터·노드 비용
signals:
  none: [단일 서버로 충분, 짧은 기간]
  local_k8s: [Kubernetes 학습이 목적]
  single_vm_k3s: [적은 비용으로 K8s 배포 경험 필요]
  managed_k8s: [다중 인스턴스·롤아웃 필요]
requires:
  # S2 제안: Decision Registry에 아직 없는 규칙
  - id: managed-k8s-needs-cloud
    when:
      - {card: devops.orchestration, in: [managed_k8s]}
    require: {card: cloud.target, not_in: [local]}
    message: 관리형 Kubernetes는 클라우드에서만 사용할 수 있습니다.
conflicts:
  # Decision Registry의 "세션 메모리 저장"을 이번 카드 묶음의 data.checkpointer=memory로 표현
  - id: orchestration-with-memory-state
    when:
      - {card: devops.orchestration, not_in: [none]}
      - {card: data.checkpointer, in: [memory]}
    message: 여러 Pod에서 메모리에 상태를 두면 재시작할 때 상태가 사라집니다. (DiV P4)
default_recommendation:
  option: none
  reason: 다중 인스턴스 신호가 없으면 Compose로 충분합니다.
learning_refs: [docker-compose, kubernetes]
div_refs: [P7]
