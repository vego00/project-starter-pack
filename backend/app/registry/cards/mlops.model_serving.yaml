card_id: mlops.model_serving
version: 1
layer: mlops
title: 모델 서빙
question: 모델을 어떻게 서빙할까요?
options:
  - id: external_api
    name: 외부 API만
    summary: 모델 서버를 직접 운영하지 않고 API만 호출합니다.
    pros: [서빙 인프라를 운영하지 않아도 됩니다]
    cons: [호출 비용과 외부 서비스 상태에 영향을 받습니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 호출량 기반
  - id: ollama
    name: Ollama 컨테이너
    summary: Ollama를 컨테이너로 띄워 모델을 직접 실행합니다.
    pros: [구성이 비교적 간단하고 데이터를 내부에 둡니다]
    cons: [모델 파일과 장비 자원을 직접 관리해야 합니다]
    learning_difficulty: medium
    ops_burden: medium
    cost_nature: 장비 비용
  - id: vllm
    name: vLLM 등 자체 GPU 서빙
    summary: GPU 서버에 서빙 엔진을 직접 운영합니다.
    pros: [처리량과 설정을 직접 조정할 수 있습니다]
    cons: [GPU 비용과 운영 부담이 가장 큽니다]
    learning_difficulty: high
    ops_burden: high
    cost_nature: GPU 비용
signals:
  external_api: [GPU 없음, 운영 인력 적음]
  ollama: [데이터 외부 전송 불가, 소규모 사용]
  vllm: [GPU 보유, 높은 처리량 필요]
conflicts:
  # Decision Registry의 ollama ∧ cloud.compute=serverless를 이번 카드 묶음의 cloud.target으로 표현
  - id: self-serving-on-cloud
    severity: warning
    when:
      - {card: mlops.model_serving, in: [ollama, vllm]}
      - {card: cloud.target, not_in: [local]}
    message: 클라우드에서 모델을 직접 서빙하려면 GPU와 모델 로딩 제약을 먼저 확인하세요.
  # S3.5 제안: API 공급자를 골랐는데 모델 서버도 직접 운영하는 조합 (DiV 1차 실행에서 발견)
  - id: api-provider-with-self-serving
    severity: warning
    when:
      - {card: model.provider, in: [gemini, openai, upstage, exaone, openrouter]}
      - {card: mlops.model_serving, in: [ollama, vllm]}
    message: API로 모델을 쓰는데 모델 서버도 직접 운영하는 선택이에요. 둘 다 필요한지 확인하고, 아니면 서빙을 '외부 API만'으로 바꾸세요.
artifacts:
  ollama: ["compose:ollama"]
default_recommendation:
  option: external_api
  reason: GPU 보유 신호가 없으면 서빙 인프라를 운영하지 않는 쪽이 안전합니다.
learning_refs: [model-serving]
div_refs: [P3]
