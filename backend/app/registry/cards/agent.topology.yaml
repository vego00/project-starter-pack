card_id: agent.topology
version: 1
layer: agent
order: 10
question: 에이전트를 어떤 구조로 구성할까요?
options:
  - id: single
    name: Single Agent
    summary: 에이전트 하나가 도구를 사용해 작업 전체를 처리합니다.
    pros: [구현과 디버깅이 가장 쉽습니다]
    cons: [역할이 많아지면 프롬프트와 도구 관리가 어려워집니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 호출량 기반
  - id: pipeline
    name: 고정 파이프라인
    summary: 정해진 순서대로 여러 단계를 코드로 연결합니다.
    pros: [실행 순서가 고정되어 재현과 평가가 쉽습니다]
    cons: [입력에 따라 흐름을 크게 바꾸기 어렵습니다]
    learning_difficulty: medium
    ops_burden: low
    cost_nature: 호출량 기반
  - id: supervisor
    name: Supervisor 라우팅
    summary: 관리자 에이전트가 다음에 실행할 에이전트를 고릅니다.
    pros: [입력에 따라 유연하게 흐름을 바꿉니다]
    cons: [라우팅이 비결정적이어서 루프 방지와 디버깅이 필요합니다]
    learning_difficulty: high
    ops_burden: medium
    cost_nature: 호출량 기반 (라우팅 호출 추가)
  - id: hierarchical
    name: 계층형 (Supervisor + Subgraph)
    summary: 관리자 아래에 독립된 하위 그래프를 둡니다.
    pros: [큰 시스템을 담당 영역별로 나눌 수 있습니다]
    cons: [상태 계약과 하위 그래프 설계 비용이 가장 큽니다]
    learning_difficulty: high
    ops_burden: high
    cost_nature: 호출량 기반 (라우팅 호출 추가)
signals:
  single: [작업 단계가 적음, 짧은 기간, 소규모 팀]
  pipeline: [작업 단계가 고정적임, 재현 가능한 평가 필요]
  supervisor: [요청 종류에 따라 처리 경로가 크게 달라짐]
  hierarchical: [에이전트가 많고 담당 팀이 나뉘어 있음]
default_recommendation:
  option: pipeline
  reason: 동적 분기가 필요하다는 신호가 없으면 재현하기 쉬운 고정 흐름에서 시작합니다. (DiV P1)
learning_refs: [multi-agent-architecture, langgraph]
div_refs: [P1]
