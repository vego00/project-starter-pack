card_id: data.vector_store
version: 1
layer: data
order: 20
title: 검색 저장소
question: 문서를 의미로 검색하는 벡터 저장소를 무엇으로 할까요?
options:
  - id: pgvector
    name: pgvector (PostgreSQL 확장)
    summary: PostgreSQL 하나에 일반 데이터와 벡터를 함께 저장해 검색합니다.
    pros: [메타데이터 필터와 조인을 SQL로 함께 씁니다, 백업할 저장소가 하나입니다]
    cons: [규모가 커지면 인덱스 설정을 배워야 합니다]
    learning_difficulty: medium
    ops_burden: medium
    cost_nature: DB 운영 비용
  - id: qdrant
    name: Qdrant
    summary: 벡터 검색 전용 서비스를 따로 띄웁니다.
    pros: [벡터 검색 전용 기능과 검색 조정 폭이 넓습니다]
    cons: [저장소가 둘로 나뉘어 백업과 데이터 정합성을 따로 관리해야 합니다]
    learning_difficulty: medium
    ops_burden: medium
    cost_nature: 별도 서비스 운영 비용
  - id: chroma
    name: Chroma
    summary: 로컬에서 바로 쓰는 임베디드 벡터 저장소입니다.
    pros: [프로토타입을 가장 빨리 만들 수 있습니다]
    cons: [여러 사람이 쓰는 운영 용도로는 따로 검증해야 합니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 추가 비용 없음
  - id: none
    name: 불필요
    summary: 의미 검색 없이 키워드나 규칙으로 찾습니다.
    pros: [구성이 가장 단순합니다]
    cons: [검색 품질 요구가 생기면 다시 설계해야 합니다]
    learning_difficulty: low
    ops_burden: low
    cost_nature: 추가 비용 없음
signals:
  pgvector: [이미 PostgreSQL 사용, 문서 규모 중소, 운영 인력 적음]
  qdrant: [벡터 검색이 핵심 기능, 대규모 문서, 고급 필터]
  chroma: [1~2주 프로토타입]
  none: [키워드나 규칙으로 충분, 문서 검색 불필요]
requires:
  # Decision Registry 규칙: pgvector는 PostgreSQL 확장
  - id: pgvector-needs-postgres
    when:
      - {card: data.vector_store, in: [pgvector]}
    require: {card: data.primary_db, in: [postgres]}
    message: pgvector는 PostgreSQL 확장이라 데이터 저장소가 PostgreSQL이어야 합니다.
artifacts:
  qdrant: ["compose:qdrant"]
default_recommendation:
  option: none
  reason: 문서 검색이 필요하다는 신호가 없으면 저장소를 늘리지 않는 쪽이 단순합니다.
learning_refs: [vector-store]
div_refs: [P6]
