# 모듈 규칙 (ADR-022). 모듈의 시작 조건과 기본 완료 기준은 여기서만 정한다.
# 모델과 대화로 빼거나 바꿀 수 없다. 근거 없는 목표치는 넣지 않고, 목표치가 필요하면 target: open으로 둔다.
# after는 앞에 적은 모듈만 가리킨다. gate_only는 그 모듈의 시작 조건만 끝나면 된다는 뜻이다.
version: 1
modules:
  - id: data
    name: 데이터
    cards: [data.primary_db, data.vector_store, data.checkpointer]
    present_when_any:
      - {card: data.primary_db, not_in: [none]}
      - {card: data.vector_store, not_in: [none]}
      - {card: data.checkpointer, not_in: [memory]}
    gates:
      - text: 테이블과 색인 구조를 docs/data-model.md에 쓰고 사용자에게 승인받는다
        why: 저장 구조를 바꾸면 이미 쌓인 데이터와 코드를 함께 고쳐야 한다
      - text: 다루는 데이터를 써도 되는 범위(저작권, 개인정보)를 사용자에게 확인한다
        why: 쓸 수 없는 데이터로 만든 기능은 통째로 버려야 한다
    criteria:
      - kind: quantitative
        text: 준비한 데이터 전체 적재, 누락 0건
        how: 적재 건수와 원본 건수를 비교한다

  - id: agent
    name: 에이전트 흐름
    cards: [agent.topology, agent.hitl, model.provider, mlops.model_serving]
    after: [{module: data}]
    gates:
      - text: 핵심 요구사항마다 평가 사례를 먼저 쓰고 사용자에게 확인받는다
        why: 평가 사례가 없으면 에이전트가 끝났는지 판단할 수 없다
      - text: 모델 API 키를 커밋하지 않는 .env에 넣고 비용 상한을 설정한다
        why: 새어 나간 키와 상한 없이 나간 비용은 되돌릴 수 없다
        when: [{card: model.provider, in: [gemini, openai, upstage, exaone, openrouter]}]
      - text: 모델 파일의 용량과 장비 요구 사항을 확인하고 직접 내려받는다
        why: 장비가 모델을 감당하지 못하면 서빙 방식부터 다시 골라야 한다
        when: [{card: mlops.model_serving, in: [ollama, vllm]}]
    criteria:
      - kind: quantitative
        text: 핵심 평가 사례 전부 통과
        how: verify-design skill로 실행해 확인한다
      - kind: quantitative
        text: 답변 응답 시간
        how: 실행 기록에서 요청부터 답변까지 걸린 시간을 잰다
        target: open
      - kind: qualitative
        text: 사람 확인 단계에서 멈추고, 승인이나 거절 뒤 이어서 실행된다
        how: 승인과 거절을 한 번씩 실행해 본다
        when: [{card: agent.hitl, not_in: [none]}]

  - id: api
    name: 서비스 API
    cards: [backend.execution]
    after: [{module: agent}]
    gates:
      - text: 요청과 응답 형식(API 계약)을 docs/api.md에 쓰고 사용자에게 확인받는다
        why: 계약이 있어야 화면과 API를 동시에 만들 수 있다
    criteria:
      - kind: quantitative
        text: API 계약의 모든 요청에 대한 자동 테스트 통과
        how: 테스트를 실행한다
      - kind: qualitative
        text: 오래 걸리는 작업도 요청이 끊기지 않고 결과를 받을 수 있다
        how: 가장 오래 걸리는 작업을 실행해 확인한다
        when: [{card: backend.execution, in: [background, queue]}]

  - id: client
    name: 사용자 접점
    name_from: product.surface
    cards: [product.surface]
    after: [{module: api, gate_only: true}]
    gates:
      - text: 주요 화면 시안을 만들고 사용자에게 승인받는다. 승인 전에는 화면 코드를 쓰지 않는다
        why: 화면을 만든 뒤 고치면 일이 몇 배로 늘어난다
        when: [{card: product.surface, in: [web]}]
      - text: 봇의 대화 흐름(질문, 답, 실패 안내)을 글로 쓰고 사용자에게 승인받는다
        why: 대화 흐름을 정하지 않고 만든 봇은 처음부터 다시 짜야 한다
        when: [{card: product.surface, in: [messenger]}]
      - text: 리포트 양식 시안을 만들고 사용자에게 승인받는다
        why: 양식이 바뀌면 리포트를 만드는 코드도 같이 바뀐다
        when: [{card: product.surface, in: [report]}]
      - text: 서비스 API 계약이 확정되어 있다
        why: 계약 없이 만든 화면은 API가 정해진 뒤 다시 고쳐야 한다
    criteria:
      - kind: quantitative
        text: 375px부터 1440px까지 가로 넘침 0건, 조작 요소 44px 이상
        how: 브라우저에서 화면 크기별로 측정한다
        when: [{card: product.surface, in: [web]}]
      - kind: qualitative
        text: 승인한 시안과 구현 결과가 같다고 사용자가 판단한다
        how: 시안과 구현 결과를 나란히 보고 확인한다

  - id: ops
    name: 운영
    cards: [devops.orchestration, cloud.target, ops.tracing]
    after: [{module: api}, {module: client}]
    gates:
      - text: 비밀값은 커밋하지 않는 .env에만 둔다
        why: 한 번 커밋된 비밀값은 기록에서 지워도 노출된 것으로 봐야 한다
      - text: 실행 추적 도구로 보낼 데이터의 범위를 사용자에게 확인한다
        why: 사용자가 쓴 원문이 외부 서비스에 쌓인다
        when: [{card: ops.tracing, in: [langsmith]}]
      - text: 클라우드 계정의 비용 상한과 알림을 먼저 설정한다
        why: 상한 없이 켜 둔 자원은 쓰지 않아도 비용이 나간다
        when: [{card: cloud.target, not_in: [local]}]
    criteria:
      - kind: quantitative
        text: 명령 하나로 모든 서비스가 시작된다
        how: 새 환경에서 실행해 확인한다
      - kind: qualitative
        text: 실행 기록에서 요청 하나의 단계별 흐름을 따라갈 수 있다
        how: 기록 화면에서 요청 하나를 골라 따라가 본다
        when: [{card: ops.tracing, not_in: [none]}]
