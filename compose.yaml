# 로컬 실행 전용 구성이다. 배포 구성은 아니다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter-local-only}
      POSTGRES_DB: starter
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      APP_PROVIDER: ${APP_PROVIDER:-mock}
      APP_DECIDER: ${APP_DECIDER:-mock}
      APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY:-}
      APP_GEMINI_MODEL: ${APP_GEMINI_MODEL:-}
      APP_AI_GATEWAY_API_KEY: ${APP_AI_GATEWAY_API_KEY:-}
      APP_JEV_MODEL: ${APP_JEV_MODEL:-typesafe-ai/jev-1.14.0}
      APP_DATABASE_URL: postgresql://starter:${POSTGRES_PASSWORD:-starter-local-only}@postgres:5432/starter
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
