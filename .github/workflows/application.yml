name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_HOST_AUTH_METHOD: trust # Throwaway job container; no password to manage.
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://starter@127.0.0.1:5432/starter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q --ignore=tests/e2e
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run browser tests against the mock app
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        env:
          APP_PROVIDER: mock
          APP_DECIDER: mock
          APP_EVIDENCE_SCOPE: none
          BACKEND_URL: http://127.0.0.1:18631
          E2E_BASE_URL: http://127.0.0.1:18632
          E2E_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm --prefix frontend ci
          APP_DATABASE_URL="$TEST_DATABASE_URL" uv run --locked uvicorn app.main:app --app-dir backend --port 18631 &
          npm --prefix frontend run dev -- --port 18632 &
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 "$E2E_BASE_URL/health" > /dev/null
          uv run --locked pytest -q tests/e2e
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
