# 인증서가 있을 때 40-use-https-when-cert-exists.sh가 기본 설정을 이 파일로 바꾼다.
server {
    listen 5173;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # scripts/deploy.sh가 VM 안에서 http로 상태를 확인한다.
    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        return 301 https://pjstarter.duckdns.org$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/pjstarter.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pjstarter.duckdns.org/privkey.pem;
    include /etc/nginx/app.conf;
}
