# 인증서가 있을 때 40-use-https-when-cert-exists.sh가 기본 설정을 이 파일로 바꾼다.
server {
    listen 5173;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # scripts/deploy.sh가 VM 안에서 http로 상태를 확인한다.
    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        return 301 https://pjstarter.duckdns.org$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/pjstarter.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pjstarter.duckdns.org/privkey.pem;
    include /etc/nginx/app.conf;

    # oauth2-proxy는 auth 프로필로 뜬다. 변수로 넘겨 Nginx 시작 시점에 주소를 찾지 않게 한다.
    resolver 127.0.0.11 valid=30s;
    set $oauth2_proxy http://oauth2-proxy:4180;

    location = /oauth2/auth {
        internal;
        proxy_pass $oauth2_proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location /oauth2/ {
        proxy_pass $oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @sign_in {
        # 상대 주소로 두면 Nginx가 컨테이너 포트(8443)를 붙인다.
        return 302 https://pjstarter.duckdns.org/oauth2/start?rd=$request_uri;
    }
}
