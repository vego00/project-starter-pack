# 화면과 API 경로. HTTP 전용 설정과 HTTPS 설정이 함께 쓴다.
# auth-*.conf는 HTTP 모드에서는 로그인 없이, HTTPS 모드에서는 oauth2-proxy 로그인을 요구한다.
root /usr/share/nginx/html;

# 프런트 요청 제한(300초)에 맞춘다. 기본 60초면 설계 생성(최대 280초)이 끊긴다.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

location /api/ {
    include /etc/nginx/auth-api.conf;
    proxy_pass http://backend:8000;
}

location = /health {
    proxy_pass http://backend:8000;
}

# 새 배포 뒤 브라우저가 옛 index.html로 지워진 JS 파일을 찾지 않게 한다.
location = /index.html {
    include /etc/nginx/auth-page.conf;
    add_header Cache-Control "no-cache";
}

location / {
    include /etc/nginx/auth-page.conf;
    try_files $uri /index.html;
}
