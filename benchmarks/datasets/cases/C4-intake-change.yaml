evaluation: intake
family: C4-feedback
variant: change_users
idea: 부트캠프에서 강사를 하고 있는데, 매주 수강생 30명 정도가 과제 저장소 링크를 제출합니다. 마감 직전에 제출이 몰려서 피드백이 며칠씩
  밀립니다. 제출된 코드를 읽고 테스트를 돌려 본 뒤, 강의에서 다룬 내용을 근거로 무엇을 고치면 좋을지 피드백 초안을 만들어 주면 좋겠습니다.
  다만 피드백은 제가 읽고 고친 다음에만 수강생에게 보내야 하고, 수강생은 자기 피드백만 볼 수 있어야 합니다. 수강생마다 지난 과제에서 반복한
  실수도 쌓아 두었다가 다음 피드백에 반영하고 싶습니다. 테스트를 돌리다 멈추거나 실패해도 그 과제만 다시 하면 되고 나머지는 계속 진행돼야 합니다.
  개발 인원은 2명, 개발 기간은 6주, 예산은 월 10만원, 주당 개발 시간은 15시간입니다. 예상 사용자는 강사를 포함해 31명으로 정했습니다.
  배포 범위는 소수 사용자(small_group)이며 GPU는 없습니다.
