# Copy of a fixed evaluation case. The source is the Notion page in `notion`; change it there
# first. `spec` was rebuilt by hand from a published write-up (no source journey), so a run skips
# drafting. Facts the write-up does not give (team, budget, users, GPU) are left blank on purpose.
id: C6
title: 토스 취약점 분석 자동화 · 놓치지 않으면서 비용 줄이기
status: 초안
notion: https://app.notion.com/p/41a96199efb3818396e7c5d8ca99c1ef
copied_on: '2026-11-16'
spec:
  idea: 여러 서비스를 운영하는 회사의 보안 담당자입니다. 서비스가 수백 개라 사람이 코드를 일일이 읽으며 취약점을 찾기에는 손이 모자랍니다. 서비스
    소스코드에서 사용자 입력이 위험하게 쓰이는 곳을 자동으로 찾아 주는 도구를 만들고 싶습니다. 소스코드가 커서 한 번에 다 읽힐 수 없고, 정보를
    너무 많이 주면 없는 취약점을 지어내거나 코드 흐름을 잘못 이해합니다. 같은 코드를 다시 분석했을 때 찾는 개수가 달라지면 믿고 쓸 수 없습니다.
    취약점을 놓치지 않는 것이 가장 중요하고, 잘못 짚은 것이 조금 섞이는 것은 괜찮습니다. 서비스 300개를 하루 세 번씩 분석해도 비용을 감당할
    수 있어야 합니다.
  goal: 보안 담당자가 서비스 소스코드에서 사용자 입력이 위험하게 쓰이는 곳을 빠짐없이 분석한 결과를 받아 볼 수 있는 상태
  context: 서비스가 수백 개라 사람이 코드를 일일이 읽으며 취약점을 찾기 어렵습니다. 소스코드가 커서 한 번에 읽힐 수 없고, 정보를 너무 많이
    주면 없는 취약점을 지어내거나 코드 흐름을 잘못 이해합니다.
  boundary: 취약점을 놓치지 않아야 하고, 잘못 짚은 것이 조금 섞이는 것은 괜찮습니다. 같은 코드를 다시 분석해도 결과가 같아야 합니다. 서비스
    300개를 하루 세 번씩 분석해도 비용을 감당할 수 있어야 합니다.
  data_traits:
  - 서비스 소스코드
  - 취약점 분석 결과
selection:
  product.surface: report
  agent.topology: supervisor
  agent.hitl: none
  model.provider: ollama
  data.primary_db: postgres
  data.vector_store: none
  data.checkpointer: postgres
  backend.execution: queue
  backend.implementation: code
  devops.orchestration: none
  mlops.model_serving: ollama
  cloud.target: local
  ops.tracing: langsmith
must_ask:
- agent.topology
- model.provider
- data.vector_store
- backend.execution
may_skip:
- mlops.model_serving
- devops.orchestration
family: C6
evaluation: design
human_review:
- 입력 경로 후보를 빠짐없이 모으는 단계가 모델 판단이 아닌 코드나 도구로 되어 있고, 모델 분석 단계와 나뉘는가
- 가능성 높은 경로를 고르는 역할과 깊이 분석하는 역할이 나뉘고, 나눈 이유가 비용이나 시간으로 적혀 있는가
- 소스코드 전체를 한 번에 넣지 않고 필요한 부분만 읽는 읽기 전용 도구가 있는가
- 같은 코드에 결과가 달라지는 문제를 다루는가(후보 전수 수집, 출력 형식 검증과 재시도 등)
- 잘못 짚은 결과를 누가 확인하는지, 직접 돌리는 모델의 장비를 미확인으로 남겼는가
- 첫 개발 작업의 입력·산출물·완료 확인이 실행 가능한가
design_checks:
- node_references
- validation
- package_matches_revision
- spec_snapshot
- fixed_choices
