# Copy of a fixed evaluation case. The source is the Notion page in `notion`; change it there
# first. `spec` was rebuilt from a published write-up (no source journey), so a run skips
# drafting. Card choices follow the page's draft B; surface and tracing were added (2026-11-20).
id: C5
title: NewDay NewAssist · 현장 질의응답 정확도 회복
status: 초안
notion: https://app.notion.com/p/41096199efb380b787afc6cc7bfa180c
copied_on: '2026-11-20'
spec:
  idea: 저희는 금융서비스 고객센터를 운영합니다. 상담사가 통화 중 고객 질문에 답하려면 내부 업무 지침 약 200개를 뒤져야 해서, 적절한 내용을
    찾는 데 평균 1분 30초 정도 걸립니다. 지침은 별도 관리 시스템에 있고 표, 목록, 안내 상자처럼 형태도 제각각입니다. 상담사는 업무 약어를
    많이 쓰며, 지침이 누락되거나 오래된 경우도 있습니다. 상담사가 자연어로 질문하면 관련 지침을 찾아 그 내용을 바탕으로 빠르고 정확한 답변
    초안을 제시하고, 확인한 근거를 보여 주는 내부 도구를 만들고 싶습니다. 상담사가 실제 고객에게 설명하기 쉽게 작성되어야 하고, 답을 찾지
    못하면 그 사실을 알려야 합니다. 답변은 가능한 한 5초 이내에 제공하고, 틀린 답에 대한 상담사 피드백을 모아 개선하고 싶습니다. 여러 명이
    쓰기 전에 적은 인원으로 정확도를 검증하고, 충분히 검증되면 사용자를 늘리려고 합니다.
  goal: 상담사가 자연어로 질문하면 내부 지침에 근거한 답변 초안과 근거를 5초 안팎으로 받고, 틀린 답은 피드백으로 개선되는 상태
  context: 금융서비스 고객센터 상담사가 통화 중 내부 지침 약 200개를 뒤져 답을 찾는 데 평균 1분 30초가 걸립니다. 지침은 형태가 제각각이고
    누락되거나 오래된 경우가 있으며, 상담사는 업무 약어를 많이 씁니다.
  boundary: 답은 확인한 지침에 근거해야 하고, 답을 찾지 못하면 그 사실을 알려야 합니다. 고객에게 직접 보내지 않고 상담사에게 초안만 제시합니다.
    적은 인원으로 정확도를 검증한 뒤 사용자를 늘립니다.
  expected_users: 10
  data_traits:
  - 내부 업무 지침(표·목록·안내 상자)
  - 상담사 피드백
  deployment_target: small_group
selection:
  product.surface: web
  agent.topology: pipeline
  agent.hitl: none
  model.provider: gemini
  data.primary_db: postgres
  data.vector_store: pgvector
  data.checkpointer: memory
  backend.execution: sync
  backend.implementation: code
  devops.orchestration: none
  mlops.model_serving: external_api
  cloud.target: gcp
  ops.tracing: logs
must_ask:
- data.primary_db
- data.vector_store
may_skip:
- mlops.model_serving
- devops.orchestration
family: C5
evaluation: design
human_review:
- 표·목록·안내 상자의 구조를 지켜 지침을 수집·정제·색인하고, 바뀐 지침을 다시 반영하는가
- 질문에 맞는 지침을 찾아 출처를 붙이고, 근거가 없거나 모순되면 추측하지 않고 알리는가
- 약어·업무 용어를 이해하거나 확인하는 절차가 있는가
- 정답이 있는 평가셋, 배포 전 회귀 평가, 피드백 분류와 지침 개선으로 이어지는 흐름이 있는가
- 5초 목표를 위해 검색·생성 지연을 따로 보고, 시간 초과·검색 실패 때의 동작을 정했는가
- 상담사가 최종 판단을 하고, 장기 피드백 저장과 단발 실행 상태를 구분하는가
design_checks:
- node_references
- validation
- package_matches_revision
- spec_snapshot
- fixed_choices
