id: C8
title: 우아한형제들 물어보새 · 고정 흐름에서 모델이 도구를 고르는 구조로
status: 초안
notion: https://app.notion.com/p/41a96199efb38142b3d4d09ee078e3b8
copied_on: '2026-11-16'
spec:
  idea: 사내 구성원 네 명 중 한 명이 쓰는 사내 질문 답변 도구를 운영하는 데이터팀입니다. 처음에는 데이터 관련 질문에만 답했는데, 이제는 사내
    전반의 업무 질문까지 들어옵니다. 정보는 사내 포털, 위키, 업무 티켓, 메신저 대화에 흩어져 있고, 메신저의 지원 채널 수백 곳에서는 담당자가
    같은 답을 여러 번 씁니다. 지금은 질문을 처리하는 순서를 저희가 미리 짜 두었는데, 새로운 종류의 질문이 나올 때마다 코드를 고쳐야 해서
    유지하기 어렵습니다. 앞에서 한 말을 기억하지 못해 이어서 물으면 맥락이 끊기고, 답이 나빴을 때 왜 그랬는지 찾기도 어렵습니다. 질문에 맞는
    정보를 찾아 출처와 함께 답하고, 자동으로 답하기 어려운 질문은 담당자에게 넘기고 싶습니다. 사용자가 원하면 언제든 담당자에게 연결될 수 있어야
    합니다.
  goal: 사내 구성원이 흩어진 사내 정보에 대한 질문에 출처가 붙은 답을 바로 받고, 자동으로 답하기 어려운 질문은 담당자에게 이어지는 상태
  context: 사내 질문 답변 도구에 사내 전반의 업무 질문이 들어옵니다. 정보는 사내 포털, 위키, 업무 티켓, 메신저 대화에 흩어져 있고, 지원 채널
    수백 곳에서 담당자가 같은 답을 여러 번 씁니다. 질문 처리 순서를 미리 짜 둔 방식은 새 질문마다 코드를 고쳐야 합니다.
  boundary: 답에는 출처가 붙어야 합니다. 자동으로 답하기 어려운 질문은 담당자에게 넘겨야 하고, 사용자가 원하면 언제든 담당자에게 연결될 수 있어야
    합니다. 이어서 묻는 질문에서 앞의 대화가 이어져야 합니다.
  data_traits:
  - 사내 문서(포털·위키·업무 티켓)
  - 메신저 대화
  - 대화 기록과 사용자 피드백
  deployment_target: small_group
selection:
  product.surface: messenger
  agent.topology: supervisor
  agent.hitl: question
  model.provider: gemini
  data.primary_db: postgres
  data.vector_store: pgvector
  data.checkpointer: postgres
  backend.execution: background
  devops.orchestration: none
  mlops.model_serving: external_api
  cloud.target: aws
  ops.tracing: langsmith
must_ask:
- agent.topology
- agent.hitl
- data.vector_store
- data.checkpointer
- ops.tracing
may_skip:
- mlops.model_serving
- devops.orchestration
family: C8
evaluation: design
human_review:
- 질문 처리 순서를 미리 고정하지 않고 모델이 질문에 따라 도구를 고르며, 반복 한도가 있는가
- 흩어진 자료를 모아 색인하는 일과 질문에 답하는 흐름이 나뉘는가
- 이전 대화를 저장하고, 전체 이력 대신 요약하거나 최근 것만 다음 질문에 쓰는가
- 자동으로 답하기 어려운 질문과 품질이 모자란 답을 담당자에게 넘기는 길이 있는가
- 답에 출처가 붙고, 실행 과정을 남겨 나쁜 답의 원인을 찾을 수 있는가
- 첫 개발 작업의 입력·산출물·완료 확인이 실행 가능한가
design_checks:
- node_references
- validation
- package_matches_revision
- spec_snapshot
- fixed_choices
