# Copy of a fixed evaluation case. The source is the Notion page in `notion`; change it there
# first. `spec` holds the confirmed GCB text from `spec_from_journey`, so a run skips drafting.
# Cards missing from `selection` take the recommendation, else the card's default.
id: C4
title: 부트캠프 과제 피드백 · 승인 후 발송
status: 초안
notion: https://app.notion.com/p/41096199efb38161ad7bde8a1d1e383a
copied_on: '2026-11-06'
spec_from_journey: 231afeaa-ce43-444b-8d28-3c4b8ca4835b
spec:
  idea: 부트캠프에서 강사를 하고 있는데, 매주 수강생 30명 정도가 과제 저장소 링크를 제출합니다. 마감 직전에 제출이 몰려서 피드백이 며칠씩 밀립니다. 제출된 코드를 읽고 테스트를
    돌려 본 뒤, 강의에서 다룬 내용을 근거로 무엇을 고치면 좋을지 피드백 초안을 만들어 주면 좋겠습니다. 다만 피드백은 제가 읽고 고친 다음에만 수강생에게 보내야 하고, 수강생은
    자기 피드백만 볼 수 있어야 합니다. 수강생마다 지난 과제에서 반복한 실수도 쌓아 두었다가 다음 피드백에 반영하고 싶습니다. 테스트를 돌리다 멈추거나 실패해도 그 과제만 다시
    하면 되고 나머지는 계속 진행돼야 합니다.
  goal: 부트캠프 강사가 수강생들의 과제 코드에 대한 피드백 초안을 확인하고 수정하여 전달할 수 있는 상태
  context: 부트캠프에서 매주 약 30명의 수강생이 과제 저장소 링크를 마감 직전에 제출하여 피드백이 며칠씩 밀리는 문제가 있습니다. 강사는 강의 내용을 근거로 한 피드백 초안
    작성, 수강생별 반복 실수 누적 반영, 개별 피드백 열람 권한 관리를 원합니다.
  boundary: 피드백은 강사가 읽고 수정한 뒤에만 수강생에게 전달되어야 합니다. 수강생은 자신의 피드백만 볼 수 있어야 합니다. 테스트 도중 멈추거나 실패해도 해당 과제만 다시
    수행하고 나머지는 계속 진행되어야 합니다.
  team_size: 2
  duration_weeks: 6
  budget: 월 10만원
  expected_users: 31
  weekly_hours: 15
  data_traits:
  - 수강생 코드
  - 개인정보(이름·이메일)
  - 강의 자료 검색 필요
  deployment_target: small_group
  has_gpu: false
selection:
  agent.topology: pipeline
  agent.hitl: approval
  model.provider: gemini
  data.primary_db: postgres
  data.vector_store: pgvector
  data.checkpointer: postgres
  backend.execution: queue
  devops.orchestration: none
  mlops.model_serving: external_api
  cloud.target: gcp
must_ask:
- agent.hitl
- backend.execution
- data.checkpointer
- data.primary_db
- data.vector_store
- cloud.target
may_skip:
- mlops.model_serving
- devops.orchestration
