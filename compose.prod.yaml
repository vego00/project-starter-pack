# 운영 VM용 덮어쓰기. 프런트를 Vite 개발 서버 대신 Nginx 정적 이미지로 바꾼다.
# 로컬: docker compose -f compose.yaml -f compose.prod.yaml up --build   (IMAGE_TAG 없이 local로 빌드)
# VM: scripts/deploy.sh가 IMAGE_TAG=<커밋 SHA>로 GHCR 이미지를 받아 실행한다.
services:
  backend:
    image: ghcr.io/vego00/project-starter-pack/backend:${IMAGE_TAG:-local}
    environment:
      # Nginx가 oauth2-proxy 로그인 결과를 X-User-Email로 넘긴다. 없으면 401.
      APP_AUTH: proxy
  frontend:
    image: ghcr.io/vego00/project-starter-pack/frontend:${IMAGE_TAG:-local}
    build:
      dockerfile: infrastructure/docker/frontend.prod.Dockerfile
    ports:
      - "${HTTPS_PUBLISH:-127.0.0.1:8443}:8443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
  # Google 로그인과 초대 명단 확인. VM .env의 COMPOSE_PROFILES=auth로 켠다.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.0
    profiles: [auth]
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: https://pjstarter.duckdns.org/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # upstream이 없다: Nginx가 /oauth2/auth로 로그인 여부만 묻는다(static://202는 v7.14가 거부).
      OAUTH2_PROXY_SCOPE: openid email
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      # 한 줄에 이메일 하나. 이 파일에 있는 계정만 들어온다.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
    volumes:
      - ./allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
  # 인증서 발급·갱신 전용. 평소에는 뜨지 않고 scripts/cert.sh가 run으로만 쓴다.
  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [certbot]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  letsencrypt:
  certbot-www:
