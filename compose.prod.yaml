# 운영 VM용 덮어쓰기. 프런트를 Vite 개발 서버 대신 Nginx 정적 이미지로 바꾼다.
# 로컬: docker compose -f compose.yaml -f compose.prod.yaml up --build   (IMAGE_TAG 없이 local로 빌드)
# VM: scripts/deploy.sh가 IMAGE_TAG=<커밋 SHA>로 GHCR 이미지를 받아 실행한다.
services:
  backend:
    image: ghcr.io/vego00/project-starter-pack/backend:${IMAGE_TAG:-local}
  frontend:
    image: ghcr.io/vego00/project-starter-pack/frontend:${IMAGE_TAG:-local}
    build:
      dockerfile: infrastructure/docker/frontend.prod.Dockerfile
    ports:
      - "${HTTPS_PUBLISH:-127.0.0.1:8443}:8443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
  # 인증서 발급·갱신 전용. 평소에는 뜨지 않고 scripts/cert.sh가 run으로만 쓴다.
  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [certbot]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  letsencrypt:
  certbot-www:
